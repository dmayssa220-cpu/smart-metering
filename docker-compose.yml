services:
  database:
    image: postgres:16-alpine
    container_name: sm-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartmetering
      POSTGRES_USER: sm_user
      POSTGRES_PASSWORD: sm_password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sm_user -d smartmetering"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    container_name: sm-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    container_name: sm-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      ConnectionStrings__Default: "Host=database;Port=5432;Database=smartmetering;Username=sm_user;Password=sm_password"
      AiService__BaseUrl: "http://ai-service:8000"
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: sm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  db_data:
